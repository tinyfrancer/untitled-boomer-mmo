<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- No `user-scalable=no`. iOS Safari has ignored it since iOS 10, so it never
         stopped the page being zoomed; Chrome Android honours it, so all it did
         there was refuse the pinch that would undo one. Zoom is instead kept from
         happening by touch-action: `manipulation` on the HUD roots and
         `pinch-zoom` on the canvas, which is what leaves a deliberate pinch
         working everywhere and therefore always reversible. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Untitled Boomer MMO</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #111;
        overflow: hidden;
        /* The canvas's `touch-action: none` used to suppress pull-to-refresh and
           the overscroll bounce as a side effect. It allows pinch now, so say
           what was actually meant rather than relying on that again. */
        overscroll-behavior: none;
        width: 100%;
        height: 100%;
      }
      #app {
        /* The HUD is an absolutely-positioned overlay inside this box, so it
           has to be the containing block. Sized in dvh below rather than fixed
           to the layout viewport for the same reason the canvas is. */
        position: relative;
        width: 100vw;
        /*
          dvh, not vh. On iOS Safari 100vh is the *large* viewport — the height
          the page would have if the browser's toolbars were retracted — so a
          canvas sized to it runs underneath the bottom toolbar. That was
          invisible while nothing lived in the bottom band; the HUD's tab bar
          sits flush against it, and disappeared entirely.

          The vh line is the fallback for browsers without dvh (iOS < 15.4),
          which is also where the bug still bites; the tab bar keeps its own
          padding so the bar's buttons are not flush to the edge either way.
        */
        height: 100vh;
        height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
