name: CI

# Minutes on a private repo are metered (2,000 a month on the free plan), so
# CI runs where it can change a decision: on pull requests, and by hand. Not on
# the merge, which would test again the head the pull request just passed.
# `ready_for_review` is listed because a draft skips the browser smoke, and
# marking it ready is what runs it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # A few minutes of work. Without a ceiling a hung step runs to GitHub's
    # default of six hours, a sixth of a month's allowance in one go.
    timeout-minutes: 10
    strategy:
      matrix:
        # 25 is what the project is developed on. 22, the LTS floor, is what
        # the cloud sessions run every gate on before they push, so CI checking
        # 25 alone still has both versions seen on every change (decision 95).
        # A Node-version-specific break in the test environment is exactly what
        # went unnoticed before there was any CI. A matrix of one, so the check
        # keeps the name a required status check knows it by.
        node: ['25']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Formatting is the repo's stated source of truth and was held by
      # discipline alone until this step existed.
      - run: npm run format:check

      # Both projects: `src`/`tests`, and `scripts/` — which is where the
      # merge-blocking smoke check lives and where nothing looked before.
      - run: npm run typecheck

      # `npm run test` with the reporter attached. Reported, never gated: the
      # point is to see which directories nothing covers.
      - run: npm run coverage

      # `tsc` used to run here too, as the first half of `npm run build`, which
      # made four full typecheck passes per PR and two of them redundant.
      - run: npm run build

  smoke:
    name: browser smoke
    # Downloads a browser and boots the dev server, so it is most of every run's
    # minutes. It guards merges into main, and a draft cannot be merged, so a
    # draft skips it: pushes to a pull request still being worked on run the
    # gates alone, and marking it ready for review runs this.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # Seven minutes on a good day, and the first run after a Playwright bump
    # downloads a browser. Past this it is hung, not slow.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        # Always --with-deps: the cache restores the browser binary, but the
        # system libraries it links against are runner state and are not cached.
        # The download itself is skipped when the cache hit already supplied it.
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        # Started and awaited in one step: the first request cold-compiles the
        # whole engine — ~520 kB of Three.js — so being served is not the same
        # as being ready.
        run: |
          npm run dev &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173 >/dev/null && exit 0
            sleep 1
          done
          echo "dev server never came up on :5173" >&2
          exit 1

      - run: npm run smoke

      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: .smoke/
          if-no-files-found: ignore
          retention-days: 7
